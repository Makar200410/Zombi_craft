<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Zombi Craft — Осада нежити</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game-root { position: fixed; inset: 0; }
    #game-canvas { display: block; position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #1c2a1c 0%, #0a0f0a 60%, #030503 100%); color: #e8e0c8; font-family: 'Trebuchet MS', system-ui, sans-serif; transition: opacity .7s; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader h1 { margin: 0; font-size: clamp(34px, 8vw, 72px); letter-spacing: 4px; color: #b8e05a; text-shadow: 0 4px 0 #2a3a12, 0 0 30px rgba(140, 220, 60, .35); font-weight: 900; }
    #loader .sub { opacity: .7; letter-spacing: 3px; font-size: 13px; text-transform: uppercase; }
    #loader .track { width: min(420px, 80vw); height: 14px; background: #111; border: 2px solid #3a4a2a; border-radius: 3px; overflow: hidden; }
    #loader-bar { height: 100%; width: 0; background: linear-gradient(90deg, #5a8a2a, #b8e05a); transition: width .2s; }
    #loader-label { font-size: 14px; opacity: .8; min-height: 18px; }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="ui"></div>
  <div id="loader">
    <h1>ZOMBI CRAFT</h1>
    <div class="sub">Строй • Исследуй • Выживай</div>
    <div class="track"><div id="loader-bar"></div></div>
    <div id="loader-label">Загрузка…</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
