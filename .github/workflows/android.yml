name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          # fullscreen immersive game: keep screen on, hide system bars theme
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="fullUser"/' android/app/src/main/AndroidManifest.xml
          # network games on the local network use plain ws:// / http:// to the host's computer
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          # apply custom Zombi Craft icon across all Android mipmap densities
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp -f public/icon-512.png "$d/ic_launcher.png" || true
              cp -f public/icon-512.png "$d/ic_launcher_round.png" || true
              cp -f public/icon-512.png "$d/ic_launcher_foreground.png" || true
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
      - name: Build & Sign Release APK (RuStore Ready)
        working-directory: android
        run: |
          chmod +x gradlew
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias zombicraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zombicraft2026 -keypass zombicraft2026 \
            -dname "CN=Makar200410, OU=GameDev, O=ZombiCraft, L=Moscow, S=Moscow, C=RU"
          ./gradlew assembleRelease --no-daemon
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias zombicraft \
            --ks-pass pass:zombicraft2026 \
            --key-pass pass:zombicraft2026 \
            --out ../ZombiCraft.apk \
            app-release-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZombiCraft-apk
          path: ZombiCraft.apk
      - name: Publish to GitHub Release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Zombi Craft — последняя сборка APK
          body: |
            Автоматическая сборка APK для Android из ветки ${{ github.ref_name }} (коммит ${{ github.sha }}).
            Скачайте ZombiCraft.apk на телефон и установите (разрешите установку из неизвестных источников).
          prerelease: true
          make_latest: true
          files: ZombiCraft.apk
