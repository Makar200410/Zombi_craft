name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          # fullscreen immersive game: keep screen on, hide system bars theme
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity"\n            android:screenOrientation="fullUser"/' android/app/src/main/AndroidManifest.xml
          # network games on the local network use plain ws:// / http:// to the host's computer
          grep -q usesCleartextTraffic android/app/src/main/AndroidManifest.xml || sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          # apply custom Zombi Craft icon across all Android mipmap densities
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp -f public/icon-512.png "$d/ic_launcher.png" || true
              cp -f public/icon-512.png "$d/ic_launcher_round.png" || true
              cp -f public/icon-512.png "$d/ic_launcher_foreground.png" || true
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          # Integrate official VK AdNetwork (myTarget) SDK for Fullscreen (2104985) & Rewarded (2104988)
          sed -i '/dependencies {/a \    implementation "com.my.target:mytarget-sdk:5.27.4"' android/app/build.gradle
          cat << 'EOF' > android/app/src/main/java/com/zombicraft/game/VkAdsBridge.java
          package com.zombicraft.game;

          import android.app.Activity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.annotation.NonNull;
          import com.my.target.ads.InterstitialAd;
          import com.my.target.ads.Reward;
          import com.my.target.ads.RewardedAd;
          import com.my.target.common.models.IAdLoadingError;

          public class VkAdsBridge {
              private final Activity activity;
              private final WebView webView;
              private InterstitialAd interstitialAd;
              private RewardedAd rewardedAd;
              private boolean interstitialReady = false;
              private boolean rewardedReady = false;

              public VkAdsBridge(Activity activity, WebView webView) {
                  this.activity = activity;
                  this.webView = webView;
              }

              private void emit(final String event, final String detail) {
                  activity.runOnUiThread(() -> {
                      if (webView != null) {
                          String safeDetail = detail == null ? "" : detail.replace("'", "\\'");
                          webView.evaluateJavascript(
                              "window.onVkAdEvent && window.onVkAdEvent('" + event + "', '" + safeDetail + "');",
                              null
                          );
                      }
                  });
              }

              @JavascriptInterface
              public void preloadAds(final int fullscreenSlotId, final int rewardedSlotId) {
                  activity.runOnUiThread(() -> {
                      loadFullscreenInternal(fullscreenSlotId, false);
                      loadRewardedInternal(rewardedSlotId, false);
                  });
              }

              private void loadFullscreenInternal(final int slotId, final boolean showWhenLoaded) {
                  if (interstitialAd != null) {
                      interstitialAd.destroy();
                  }
                  interstitialReady = false;
                  interstitialAd = new InterstitialAd(slotId, activity);
                  interstitialAd.setListener(new InterstitialAd.InterstitialAdListener() {
                      @Override
                      public void onLoad(@NonNull InterstitialAd ad) {
                          interstitialReady = true;
                          emit("fullscreen_loaded", "");
                          if (showWhenLoaded) {
                              interstitialReady = false;
                              ad.show();
                          }
                      }

                      @Override
                      public void onNoAd(@NonNull IAdLoadingError error, @NonNull InterstitialAd ad) {
                          interstitialReady = false;
                          emit("fullscreen_failed", error.getMessage());
                      }

                      @Override
                      public void onClick(@NonNull InterstitialAd ad) {}

                      @Override
                      public void onDisplay(@NonNull InterstitialAd ad) {
                          emit("ad_display", "fullscreen");
                      }

                      @Override
                      public void onDismiss(@NonNull InterstitialAd ad) {
                          interstitialReady = false;
                          emit("fullscreen_dismissed", "");
                          loadFullscreenInternal(slotId, false);
                      }

                      @Override
                      public void onFailedToShow(@NonNull InterstitialAd ad) {
                          interstitialReady = false;
                          emit("fullscreen_failed", "failed_to_show");
                      }

                      @Override
                      public void onVideoCompleted(@NonNull InterstitialAd ad) {}
                  });
                  interstitialAd.load();
              }

              private void loadRewardedInternal(final int slotId, final boolean showWhenLoaded) {
                  if (rewardedAd != null) {
                      rewardedAd.destroy();
                  }
                  rewardedReady = false;
                  rewardedAd = new RewardedAd(slotId, activity);
                  rewardedAd.setListener(new RewardedAd.RewardedAdListener() {
                      @Override
                      public void onLoad(@NonNull RewardedAd ad) {
                          rewardedReady = true;
                          emit("rewarded_loaded", "");
                          if (showWhenLoaded) {
                              rewardedReady = false;
                              ad.show();
                          }
                      }

                      @Override
                      public void onNoAd(@NonNull IAdLoadingError error, @NonNull RewardedAd ad) {
                          rewardedReady = false;
                          if (showWhenLoaded) {
                              emit("rewarded_failed", error.getMessage());
                          }
                      }

                      @Override
                      public void onClick(@NonNull RewardedAd ad) {}

                      @Override
                      public void onDisplay(@NonNull RewardedAd ad) {
                          emit("ad_display", "rewarded");
                      }

                      @Override
                      public void onDismiss(@NonNull RewardedAd ad) {
                          rewardedReady = false;
                          emit("rewarded_dismissed", "");
                          loadRewardedInternal(slotId, false);
                      }

                      @Override
                      public void onFailedToShow(@NonNull RewardedAd ad) {
                          rewardedReady = false;
                          emit("rewarded_failed", "failed_to_show");
                      }

                      @Override
                      public void onReward(@NonNull Reward reward, @NonNull RewardedAd ad) {
                          emit("rewarded_earned", reward.type);
                      }
                  });
                  rewardedAd.load();
              }

              @JavascriptInterface
              public void showFullscreenAd(final int slotId) {
                  activity.runOnUiThread(() -> {
                      if (interstitialAd != null && interstitialReady) {
                          interstitialReady = false;
                          interstitialAd.show();
                      } else {
                          loadFullscreenInternal(slotId, true);
                      }
                  });
              }

              @JavascriptInterface
              public void showRewardedAd(final int slotId) {
                  activity.runOnUiThread(() -> {
                      if (rewardedAd != null && rewardedReady) {
                          rewardedReady = false;
                          rewardedAd.show();
                      } else {
                          loadRewardedInternal(slotId, true);
                      }
                  });
              }
          }
          EOF
          cat << 'EOF' > android/app/src/main/java/com/zombicraft/game/MainActivity.java
          package com.zombicraft.game;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      VkAdsBridge vkAdsBridge = new VkAdsBridge(this, getBridge().getWebView());
                      getBridge().getWebView().addJavascriptInterface(vkAdsBridge, "VkAdsBridge");
                      vkAdsBridge.preloadAds(2104985, 2104988);
                  }
              }
          }
          EOF
      - name: Build & Sign Release APK (RuStore Ready)
        working-directory: android
        run: |
          chmod +x gradlew
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias zombicraft \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zombicraft2026 -keypass zombicraft2026 \
            -dname "CN=Makar200410, OU=GameDev, O=ZombiCraft, L=Moscow, S=Moscow, C=RU"
          ./gradlew assembleRelease --no-daemon
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release-key.jks \
            --ks-key-alias zombicraft \
            --ks-pass pass:zombicraft2026 \
            --key-pass pass:zombicraft2026 \
            --out ../ZombiCraft.apk \
            app-release-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZombiCraft-apk
          path: ZombiCraft.apk
      - name: Publish to GitHub Release "apk-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Zombi Craft — последняя сборка APK
          body: |
            Автоматическая сборка APK для Android из ветки ${{ github.ref_name }} (коммит ${{ github.sha }}).
            Скачайте ZombiCraft.apk на телефон и установите (разрешите установку из неизвестных источников).
          prerelease: true
          make_latest: true
          files: ZombiCraft.apk
